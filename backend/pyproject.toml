[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvforecast"
version = "0.1.0"
description = "PV power generation forecasting and simulation core (HEMS AI Forecasting)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "pvlib>=0.11",
    "pandas>=2.1",
    "numpy>=1.24",
    "requests>=2.28",
    "timezonefinder>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pvforecast = "pvforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
